name: CI

on:
  pull_request:
    branches: [main]

jobs:
  agent-docs:
    name: Check Agent Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required agent docs exist
        run: |
          missing=0
          for f in documents/SPEC.md documents/BACKLOG.md documents/HANDOFF.md; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          exit $missing

  application:
    name: Test, lint and build application
    # Standard hosted runner usage is free for public repositories. Do not
    # silently enable paid private-repository runs if visibility changes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Tests, lint and full TypeScript production build
        run: npm run build
      # Deliberately no artifact upload, persistent cache, secrets, deployment,
      # browser automation, larger runner, or billing-setting changes.
